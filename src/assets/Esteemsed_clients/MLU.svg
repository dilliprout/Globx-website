<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="100%" height="100%">
  <g transform="translate(10, 10)">
    <!-- Shield / Law Seal -->
    <path d="M40 4 L72 16 L72 48 Q72 70 40 76 Q8 70 8 48 L8 16 Z" fill="#0b2545" stroke="#c59b27" stroke-width="2.5"/>
    <path d="M40 9 L66 19 L66 46 Q66 64 40 70 Q14 64 14 46 L14 19 Z" fill="none" stroke="#c59b27" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Scales of Justice -->
    <line x1="40" y1="20" x2="40" y2="52" stroke="#e0a96d" stroke-width="2.5"/>
    <line x1="24" y1="26" x2="56" y2="26" stroke="#e0a96d" stroke-width="2.5"/>
    
    <!-- Left Scale -->
    <line x1="24" y1="26" x2="18" y2="38" stroke="#c59b27" stroke-width="1.2"/>
    <line x1="24" y1="26" x2="30" y2="38" stroke="#c59b27" stroke-width="1.2"/>
    <path d="M16 38 Q24 43 32 38 Z" fill="#e0a96d"/>

    <!-- Right Scale -->
    <line x1="56" y1="26" x2="50" y2="38" stroke="#c59b27" stroke-width="1.2"/>
    <line x1="56" y1="26" x2="62" y2="38" stroke="#c59b27" stroke-width="1.2"/>
    <path d="M48 38 Q56 43 64 38 Z" fill="#e0a96d"/>

    <!-- Base -->
    <rect x="30" y="52" width="20" height="4" fill="#e0a96d" rx="1"/>
  </g>

  <!-- Typography -->
  <text x="96" y="42" font-family="'Inter', 'Roboto', sans-serif" font-weight="900" font-size="20" fill="#0b2545" letter-spacing="0.5">MADHUSUDAN</text>
  <text x="96" y="62" font-family="'Inter', 'Roboto', sans-serif" font-weight="800" font-size="13" fill="#8c6d17" letter-spacing="0.8">LAW UNIVERSITY CUTTACK</text>
  <text x="96" y="78" font-family="'Inter', 'Roboto', sans-serif" font-weight="600" font-size="9.5" fill="#134074">State University · Govt. of Odisha</text>
</svg>
